import os
import requests
from playwright.sync_api import sync_playwright

WEBHOOK = os.environ["DISCORD_WEBHOOK"]

URL = "https://www.sharkvalleytramtours.com/event-calendar/"

TARGET_DATE = "November 7"
TARGET_TIME = "2:00 PM"


def send_alert(message):
    requests.post(
        WEBHOOK,
        json={"content": message},
        timeout=30
    )


with sync_playwright() as p:
    browser = p.chromium.launch(headless=True)

    page = browser.new_page()

    page.goto(
        URL,
        wait_until="networkidle",
        timeout=60000
    )

    page.wait_for_timeout(5000)

    text = page.locator("body").inner_text()

    browser.close()


print("Page loaded successfully")

# Debug output so we can see what GitHub sees
print(text[:2000])


if TARGET_DATE in text and TARGET_TIME in text:

    if "Sold Out" not in text and "Sold out" not in text:
        send_alert(
            "🚨 Shark Valley Tram Tour may be available!\n"
            "November 7 at 2:00 PM\n\n"
            + URL
        )

        print("ALERT SENT")

    else:
        print("Still sold out")

else:
    print("Target date/time not found")
